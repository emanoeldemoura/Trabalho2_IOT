# No limite (parte 1): 7,9 °C por 30 s NÃO pode ligar o alarme
# rodar com: --fail-text "ALARME LIGADO"
name: Limite 7,9 C nao toca
version: 1
author: VacinaSegura
steps:
  - wait-serial: 'Modo: demonstracao'
  - set-control:
      part-id: dht1
      control: temperature
      value: 7.9
  - wait-serial: 'T=7.9C'
  - delay: 30000ms
